[package]
name = "polar"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/polar-note-revision"]

[dependencies]
polar-note-revision = { path = "crates/polar-note-revision" }
gpui-kit = "0.9.0"
markdown = "1.0.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGPath"] }
objc2-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CAShapeLayer", "CATransaction"] }
raw-window-handle = "0.6.2"

[profile.dev]
debug = 0

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
